[package]
name = "wayne-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
anyhow = "1.0.95"
convert_case = "0.8.0"
fxhash = "0.2.1"
proc-macro2 = "1.0.94"
quick-xml = { version = "0.37.2", features = ["overlapped-lists", "serialize"] }
quote = "1.0.39"
serde = { version = "1.0.218", features = ["derive"] }
serde_with = "3.12.0"
syn = "2.0.99"
thiserror = "2.0.12"
